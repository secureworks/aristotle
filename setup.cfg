[tool:pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    examples: tests that load the (large) examples/example.rules ruleset
    slow: benchmarks and other long-running tests; skipped unless --run-slow is given

[coverage:run]
source = aristotle
branch = True

[coverage:report]
show_missing = True
skip_covered = False
